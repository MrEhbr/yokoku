name: Build the stylesheet
description: Render crates/web/tailwind.css to crates/web/assets/tailwind.css, which asset! needs at compile time

runs:
  using: composite
  steps:
    - name: Build the stylesheet
      shell: bash
      run: |
        curl -sSfLo "$RUNNER_TEMP/tailwindcss" https://github.com/tailwindlabs/tailwindcss/releases/download/v4.1.5/tailwindcss-linux-x64
        chmod +x "$RUNNER_TEMP/tailwindcss"
        "$RUNNER_TEMP/tailwindcss" -i crates/web/tailwind.css -o crates/web/assets/tailwind.css
