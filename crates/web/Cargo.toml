[package]
name = "yokoku-web"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[package.metadata.cargo-shear]
ignored = ["uuid"]

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "gallery"
path = "gallery/main.rs"

[dependencies]
yokoku-domain.workspace = true
yokoku-library = { workspace = true, optional = true }
yokoku-media = { workspace = true, optional = true }
yokoku-naming.workspace = true

jiff = { workspace = true, features = ["serde"] }
serde.workspace = true

dioxus = { version = "=0.7.10", features = ["fullstack", "router"] }
dioxus-icons = { version = "0.1.0", default-features = false }
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", rev = "9a758255ea26e2b20c8cecf4c1c946feb9e71da7", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["net", "sync", "time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["js"] }

gloo-timers = { version = "0.3", features = ["futures"] }

[dev-dependencies]
rstest.workspace = true

[features]
default = []
web = ["dioxus/web"]
server = ["dioxus/server", "dep:yokoku-library", "dep:yokoku-media"]
