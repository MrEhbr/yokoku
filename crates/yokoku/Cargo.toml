[package]
name = "yokoku"
description = "TBD"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[[bin]]
name = "yokoku"
path = "src/main.rs"

[features]
default = []
tokio-console = ["dep:console-subscriber"]

[dependencies]
yokoku-db.workspace = true
yokoku-domain.workspace = true
yokoku-download-clients.workspace = true
yokoku-downloads.workspace = true
yokoku-events.workspace = true
yokoku-integrations.workspace = true
yokoku-jobs.workspace = true
yokoku-library.workspace = true
yokoku-media.workspace = true
yokoku-media-servers.workspace = true
yokoku-metadata.workspace = true
yokoku-naming.workspace = true
yokoku-system.workspace = true
yokoku-web = { workspace = true, features = ["server"] }

anyhow.workspace = true
async-trait.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

clap = { version = "4.5", features = ["derive"] }
clap-verbosity-flag = { version = "3.0", default-features = false, features = ["tracing"] }
console-subscriber = { version = "0.5", optional = true }
owo-colors = { version = "4.4", features = ["supports-colors"] }
tracing-appender = "0.2"
yokoku-config = { path = "../config" }

[dev-dependencies]
yokoku-test-support.workspace = true

jiff.workspace = true
tempfile.workspace = true
wiremock.workspace = true

assert_cmd = "2.1"
criterion = "0.8"
predicates = "3.1"

[[bench]]
name = "benchmark"
harness = false

[lints]
workspace = true
