[package]
name = "yokoku"
description = "TBD"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[[bin]]
name = "yokoku"
path = "src/main.rs"

[features]
default = []
tokio-console = ["dep:console-subscriber"]

[dependencies]
yokoku-core.workspace = true
yokoku-domain.workspace = true
yokoku-infra.workspace = true
yokoku-web = { workspace = true, features = ["server"] }

anyhow.workspace = true
async-trait.workspace = true
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

clap = { version = "4.5", features = ["derive"] }
clap-verbosity-flag = { version = "3.0", default-features = false, features = ["tracing"] }
config = { version = "0.15", default-features = false, features = ["json", "toml"] }
console-subscriber = { version = "0.5", optional = true }
jiff-cron = "0.3"
owo-colors = { version = "4.4", features = ["supports-colors"] }
tracing-appender = "0.2"

[dev-dependencies]
yokoku-test-support.workspace = true

tempfile.workspace = true
wiremock.workspace = true

assert_cmd = "2.1"
criterion = "0.8"
predicates = "3.1"
pprof = { version = "0.15", features = ["protobuf-codec"] }

[[bench]]
name = "benchmark"
harness = false

[lints]
workspace = true
