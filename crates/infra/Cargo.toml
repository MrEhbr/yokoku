[package]
name = "yokoku-infra"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
yokoku-core.workspace = true
yokoku-domain.workspace = true

async-trait.workspace = true
isolang.workspace = true
jiff = { workspace = true, features = ["serde"] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "process", "rt", "sync", "time"] }
tracing.workspace = true

base64 = "0.23"
governor = { version = "0.10", default-features = false, features = ["std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
walkdir = "2.5"

[dev-dependencies]
yokoku-test-support.workspace = true

proptest.workspace = true
rstest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "process", "sync", "time", "test-util"] }
uuid.workspace = true
wiremock.workspace = true
