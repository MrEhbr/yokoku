[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
repository = "https://github.com/mrehbr/yokoku"
license = "MIT"

[workspace.dependencies]
yokoku-db = { path = "crates/db" }
yokoku-detect = { path = "crates/detect" }
yokoku-domain = { path = "crates/domain" }
yokoku-downloads = { path = "crates/downloads" }
yokoku-events = { path = "crates/events" }
yokoku-integrations = { path = "crates/integrations" }
yokoku-jobs = { path = "crates/jobs" }
yokoku-library = { path = "crates/library" }
yokoku-media = { path = "crates/media" }
yokoku-metadata = { path = "crates/metadata" }
yokoku-naming = { path = "crates/naming" }
yokoku-system = { path = "crates/system" }
yokoku-transmission = { path = "crates/transmission" }

anyhow = "1.0"
apalis = "1.0.0-rc.10"
apalis-cron = { version = "1.0.0-rc.9", default-features = false, features = ["jiff"] }
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
clap-verbosity-flag = { version = "3.0", features = ["tracing"], default-features = false }
config = { version = "0.15", features = ["json", "toml"], default-features = false }
console-subscriber = "0.5"
hunch = { version = "2.0.2", default-features = false }
isolang = { version = "2.4", features = ["lowercase_names"] }
jiff = "0.2"
jiff-cron = "0.3"
owo-colors = { version = "4.4", features = ["supports-colors"] }
regex = "1.13"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
secrecy = { version = "0.10", features = ["serde"] }
serde_json = "1.0"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "json"] }
strsim = "0.11"
thiserror = "2.0"
tokio = "1"
tokio-util = "0.7"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
unicode-normalization = "0.1"
uuid = { version = "1.26", features = ["v7", "serde"] }
walkdir = "2.5"

assert_cmd = "2.1"
criterion = "0.8"
predicates = "3.1"
proptest = "1.11"
rstest = "0.27"
tempfile = "3.14"
toml = "1.1"
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.metadata.bin]
cargo-llvm-cov = "0.6"

[profile.dev]
# macOS defaults this to "unpacked", which leaves one `.rcgu.o` per codegen unit
# beside the binaries and never removes it. A test binary's own directory is
# read whole by `CFBundleGetMainBundle`, which `SCDynamicStore` reaches through
# on every process start, so the litter is paid per test.
split-debuginfo = "packed"

[profile.release]
strip = true
lto = true
codegen-units = 1

[profile.bench]
inherits = "release"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
