[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.6.0"
edition = "2024"
repository = "https://github.com/mrehbr/yokoku"
license = "MIT"

[workspace.dependencies]
yokoku-core = { path = "crates/core" }
yokoku-domain = { path = "crates/domain" }
yokoku-infra = { path = "crates/infra" }
yokoku-test-support = { path = "crates/test-support" }
yokoku-web = { path = "crates/web" }

anyhow = "1.0"
async-trait = "0.1"
isolang = { version = "2.4", features = ["list_languages", "lowercase_names"] }
jiff = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls-no-provider"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "json"] }
thiserror = "2.0"
tokio = "1"
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
uuid = { version = "1.26", features = ["v7", "serde"] }

proptest = "1.11"
rstest = "0.27"
tempfile = "3.14"
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.metadata.bin]
cargo-llvm-cov = "0.6"

[profile.dev]
# macOS defaults this to "unpacked", which leaves one `.rcgu.o` per codegen unit
# beside the binaries and never removes it. A test binary's own directory is
# read whole by `CFBundleGetMainBundle`, which `SCDynamicStore` reaches through
# on every process start, so the litter is paid per test.
split-debuginfo = "packed"

[profile.release]
strip = true
lto = true
codegen-units = 1

[profile.release.package.yokoku-web]
opt-level = "z"

[profile.bench]
inherits = "release"
# Symbols and line tables for profiles taken with `--profile-time`.
strip = false
debug = "line-tables-only"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
