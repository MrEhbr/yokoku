[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
repository = "https://github.com/mrehbr/yokoku"
license = "MIT"

[workspace.dependencies]
yokoku-db = { path = "crates/db" }
yokoku-domain = { path = "crates/domain" }
yokoku-events = { path = "crates/events" }
yokoku-library = { path = "crates/library" }

anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
clap-verbosity-flag = { version = "3.0", features = ["tracing"], default-features = false }
config = { version = "0.15", features = ["toml"], default-features = false }
console-subscriber = "0.5"
jiff = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2.0"
tokio = "1"
tokio-util = "0.7"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
uuid = { version = "1.26", features = ["v7", "serde"] }

assert_cmd = "2.1"
criterion = "0.8"
predicates = "3.1"
proptest = "1.11"
rstest = "0.27"
tempfile = "3.14"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.metadata.bin]
cargo-llvm-cov = "0.6"

[profile.release]
strip = true
lto = true
codegen-units = 1

[profile.bench]
inherits = "release"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
