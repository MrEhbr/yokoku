[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
repository = "https://github.com/mrehbr/yokoku"
license = "MIT"

[workspace.dependencies]
yokoku-db = { path = "crates/db" }
yokoku-detect = { path = "crates/detect" }
yokoku-domain = { path = "crates/domain" }
yokoku-download-clients = { path = "crates/download-clients" }
yokoku-downloads = { path = "crates/downloads" }
yokoku-events = { path = "crates/events" }
yokoku-integrations = { path = "crates/integrations" }
yokoku-jobs = { path = "crates/jobs" }
yokoku-library = { path = "crates/library" }
yokoku-media = { path = "crates/media" }
yokoku-media-servers = { path = "crates/media-servers" }
yokoku-metadata = { path = "crates/metadata" }
yokoku-naming = { path = "crates/naming" }
yokoku-system = { path = "crates/system" }
yokoku-web = { path = "crates/web" }

anyhow = "1.0"
async-trait = "0.1"
isolang = { version = "2.4", features = ["lowercase_names"] }
jiff = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = "1"
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
uuid = { version = "1.26", features = ["v7", "serde"] }

proptest = "1.11"
rstest = "0.27"
tempfile = "3.14"
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.metadata.bin]
cargo-llvm-cov = "0.6"

[profile.dev]
# macOS defaults this to "unpacked", which leaves one `.rcgu.o` per codegen unit
# beside the binaries and never removes it. A test binary's own directory is
# read whole by `CFBundleGetMainBundle`, which `SCDynamicStore` reaches through
# on every process start, so the litter is paid per test.
split-debuginfo = "packed"

[profile.release]
strip = true
lto = true
codegen-units = 1

[profile.release.package.yokoku-web]
opt-level = "z"

[profile.bench]
inherits = "release"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
