# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com

# The lines below are called `modelines`. See `:help modeline`
# Feel free to remove those if you don't want/need to use them.
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

project_name: yokoku

env:
  - DOCKER_REGISTRY={{ if index .Env "DOCKER_REGISTRY" }}{{ .Env.DOCKER_REGISTRY }}{{ else }}ghcr.io{{ end }}
  - DOCKER_USERNAME={{ if index .Env "DOCKER_USERNAME" }}{{ .Env.DOCKER_USERNAME }}{{ else }}mrehbr{{ end }}

before:
  hooks:
    - dx bundle --release --platform web --fullstack false --package yokoku-web --features web --out-dir target/web

builds:
  - builder: rust
    flags:
      - --release
      - -p={{ .ProjectName }}
      - --config=profile.release.strip=false
    hooks:
      post:
        - dx tools assets {{ .Path }} target/web/public/assets
        - zig objcopy --strip-all {{ .Path }} {{ .Path }}.stripped
        - mv {{ .Path }}.stripped {{ .Path }}
    targets:
      - x86_64-unknown-linux-musl
      - aarch64-unknown-linux-musl

archives:
  - formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE*
      - README*
      - CHANGELOG*
      - src: target/web/public
        dst: public
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt
changelog:
  disable: false

nix:
  - name: yokoku
    repository:
      owner: MrEhbr
      name: nur-packages
      token: "{{ .Env.NUR_TOKEN }}"
    homepage: https://github.com/MrEhbr/yokoku
    description: Self-hosted manager for a movie and TV library
    license: mit
    main_program: yokoku
    dependencies:
      - ffmpeg-headless
    install: |
      mkdir -p $out/bin $out/share/yokoku
      cp -v ./yokoku $out/bin/yokoku
      cp -vr ./public $out/share/yokoku/public
      installShellCompletion --cmd yokoku \
        --bash <(./yokoku completions bash) \
        --fish <(./yokoku completions fish) \
        --zsh <(./yokoku completions zsh)
      wrapProgram $out/bin/yokoku \
        --prefix PATH : ${lib.makeBinPath [ ffmpeg-headless ]} \
        --set-default DIOXUS_PUBLIC_PATH $out/share/yokoku/public

release:
  draft: false
  prerelease: auto
  mode: replace

dockers_v2:
  - dockerfile: Dockerfile
    extra_files:
      - target/web/public
      - config/docker.toml
    platforms:
      - linux/amd64
      - linux/arm64
    images:
      - "{{ .Env.DOCKER_REGISTRY }}/{{ tolower .Env.DOCKER_USERNAME }}/{{ .ProjectName }}"
    tags:
      - "{{ .Tag }}"
      - "latest"
      - "v{{ .Major }}"
      - "v{{ .Major }}.{{ .Minor }}"
    labels:
      org.opencontainers.image.created: "{{.Date}}"
      org.opencontainers.image.title: "{{.ProjectName}}"
      org.opencontainers.image.revision: "{{.FullCommit}}"
      org.opencontainers.image.version: "{{.Version}}"
      org.opencontainers.image.source: "{{.GitURL}}"
