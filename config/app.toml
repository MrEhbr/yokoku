[log]
format = "console"
output = "stderr"

[database]
path = "yokoku.db"

[clock]
# timezone = "Europe/Berlin"

# The token is read from APP__METADATA__TMDB_TOKEN; keep it out of this file.
[metadata]
language = "en-US"
region = "US"

# The password is read from APP__TRANSMISSION__PASSWORD; keep it out of this file.
[transmission]
url = "http://localhost:9091/transmission/rpc"
# username = "yokoku"

[add]
monitor = "all"

[list]
sort = "title"

[upcoming]
days = 14

# Cron schedules with seconds.
[serve]
sync_downloads = "*/30 * * * * *"
execute_imports = "*/5 * * * * *"
cleanup_recycle = "0 0 4 * * *"
rescan_media_server = "*/10 * * * * *"

# How finished downloads reach the library: hardlink, copy or move.
[import]
mode = "hardlink"

# Deleted files move here and are kept for keep_days; without a folder they are deleted.
[recycle]
# folder = "/media/recycle"
keep_days = 30

# Rescans after library changes; the API key is read from APP__JELLYFIN__API_KEY.
[jellyfin]
# url = "http://localhost:8096"

[greet]
greeting = "Hello"
count = 1
